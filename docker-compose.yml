# ExamForge - Production Multi-Container Orchestration
# Member 5: Infrastructure & Services Orchestration

version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: examforge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: examforge_db
      POSTGRES_USER: examforge_user
      POSTGRES_PASSWORD: examforge_secure_pass_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examforge_user -d examforge_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: examforge_backend
    restart: unless-stopped
    environment:
      DEBUG: "False"
      SECRET_KEY: "examforge-production-ultra-secure-key-member5-integration"
      DB_NAME: examforge_db
      DB_USER: examforge_user
      DB_PASSWORD: examforge_secure_pass_2026
      DB_HOST: db
      DB_PORT: 5432
      ALLOWED_HOSTS: "localhost,127.0.0.1,examforge.institutional.edu"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_volume:/app/media
      - static_volume:/app/staticfiles
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: examforge_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  media_volume:
  static_volume:
